name: Build and Deploy to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Deployment target: beta or release'
        required: true
        default: 'beta'
        type: choice
        options:
          - beta
          - release

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PotentiaMod
        uses: actions/checkout@v4

      - name: Force Git to use HTTPS instead of SSH
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm run --workspaces install

      - name: Generate files
        run: npm --workspace scratch-gui prepublish

      - name: Build
        run: cross-env NODE_ENV=production npm run --workspaces build

      - name: Set deploy directory
        run: |
          if [ "${{ github.event.inputs.target }}" == "release" ]; then
            echo "DEPLOY_DIR=/" >> $GITHUB_ENV
            echo "DEPLOY_MESSAGE=New Release Version from PotentiaMod ${GITHUB_SHA:0:7}" >> $GITHUB_ENV
          else
            echo "DEPLOY_DIR=beta" >> $GITHUB_ENV
            echo "DEPLOY_MESSAGE=A Beta Version from PotentiaMod ${GITHUB_SHA:0:7}" >> $GITHUB_ENV
          fi

      - name: Checkout PotentiaMod
        uses: actions/checkout@v4
        with:
          repository: PotentiaMod/potentiamod.github.io
          token: ${{ secrets.DEPLOY_TOKEN }}
          path: gh-pages

      - name: Deploy to target directory
        run: |
          cd gh-pages
          find "$DEPLOY_DIR" -mindepth 1 -delete
          cp -r $GITHUB_WORKSPACE/packages/scratch-gui/build/* "$DEPLOY_DIR"/
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --quiet && git diff --staged --quiet || \
            git commit -m "$DEPLOY_MESSAGE"
          git push